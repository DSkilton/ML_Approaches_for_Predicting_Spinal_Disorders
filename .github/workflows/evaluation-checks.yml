name: Leakage-safe evaluation checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-evaluation.txt
      - run: python -m pytest -q
      - run: python safe_evaluation.py --data data_set/combined.csv --output results/evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-spinal-reference-evaluation
          path: results/evaluation.json
